# sleep-lock.py's own `lock` subcommand checks for an already-running
# swaylock itself (same pidof guard this used to run inline) before pausing
# the pomodoro, so no `pidof swaylock ||` prefix is needed here any more.
$lock_cmd    = ~/.config/mango/scripts/sleep-lock.py lock
$busy        = ~/.config/mango/scripts/busy.sh
# busy.sh exits 0 (and is skipped by ||) when a package transaction or a
# fresh download is in flight — the same veto battery-guard.sh's emergency
# suspend and powermenu's Shutdown button already honor. Only reaches the
# suspend when it exits 1 (idle).
$suspend_cmd = $busy || systemctl suspend || loginctl suspend
$pomodoro    = mango-bard pomo

# `before_sleep_cmd` is deliberately unset and `inhibit_sleep` is 0 here.
# hypridle's `inhibit_sleep = 3` (wait-for-lock) only works if the
# compositor advertises `hyprland-lock-notify-v1`; mango exposes
# `ext-session-lock-v1` (wlroots) instead, so it silently falls back to
# `SLEEP_INHIBIT_NORMAL` — a plain sleep inhibitor released the instant
# `before_sleep_cmd` is *spawned*, not once it has actually locked the
# screen (confirmed against hypridle v0.1.8 source, `Hypridle.cpp`'s
# `handleDbusSleep`/`uninhibitSleep`). No value here can fix that on this
# compositor. Lock-before-sleep is instead owned by mango-sleep-lock.py
# (its own systemd user unit, own logind delay inhibitor), which also
# pauses the pomodoro before sleep — see its own file header.
general {
    lock_cmd      = $lock_cmd
    inhibit_sleep = 0
}

# Break watch, read by the pomodoro (T7c, mango-bard's pomo.rs). 30s of no
# input means the user really did step away, so the nag stays quiet. A
# missing flag part-way into a break means the opposite: the break is being
# ignored.
listener {
    timeout    = 30
    on-timeout = $pomodoro idle 1
    on-resume  = $pomodoro idle 0
}

listener {
    timeout = 300 # 5mins
    on-timeout = $lock_cmd
    # Autostarts a focus block the moment the user is back at the keyboard
    # after an idle-triggered lock — see pomo.rs's `unlock` verb doc comment
    # for what this narrows versus clock.sh's old `pgrep swaylock` poll (a
    # manual SUPER+L lock does not go through this listener, so it does not
    # autostart a block; only an idle-timeout lock does).
    on-resume  = $pomodoro unlock
}

listener {
    timeout = 600 # 10mins
    # `hyprctl dispatch dpms` is a no-op under mango — it isn't Hyprland, and
    # has no dpms dispatcher of its own, so panels never actually blanked at
    # this mark. mango does implement zwlr-output-power-management-v1, which
    # wlopm drives directly; '*' targets every output.
    #
    # on-resume goes through remote.sh --idle-wake, not a bare `wlopm --on
    # '*'`: VNC input resets this listener's idle timer same as local input,
    # so a bare --on would relight both panels on the next remote keystroke
    # after any 10-minute quiet spell, defeating wayvnc-privacy's blanking.
    # --idle-wake is a no-op while that blanking is active (remote.sh's own
    # header has the state file it checks).
    on-timeout = wlopm --off '*'
    on-resume = ~/.config/ironbar/scripts/remote.sh --idle-wake
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
