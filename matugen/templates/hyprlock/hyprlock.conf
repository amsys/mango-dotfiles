# Generated by matugen. Overwritten on every wallpaper switch.
#
# Mirrors the boot screen (system/plymouth/theme/mango.script) and the
# mango-sddm greeter (system/sddm/theme/Main.qml): one centred column of
# clock, date line and card, on the blurred wallpaper, with the same
# Material 3 role names. As on the boot screen, the date line carries the
# TPM TOTP. hyprlock has no QML, so the card is a `shape` widget behind the
# `input-field`, not a container the input field sits inside.
#
# Column, top to bottom (Main.qml spacing): clock 102, gap 2, date line 22,
# gap 28, card 86 (input 46 + 20 padding each side) = 240 px high, centred.
# hyprlock's y axis points up, so the top edge is at y = +120:
#   clock centre  +120 - 51                =  +69
#   date centre   +120 - 102 - 2 - 11      =   +5
#   card centre   +120 - 126 - 28 - 43     =  -77
# Notices sit under the card, one 24 px row each from y = -143. They are
# outside the card, so a long notice cannot overflow it.
#
# hyprlock is the primary locker (see docs/power.md); swaylock
# (matugen/templates/swaylock/config) stays the fallback sleep-lock.py
# starts if hyprlock never confirms a lock, and keeps its own plain ring —
# it has no card to theme.
#
# Fingerprint login is off here. sleep-lock.py starts hyprlock with a
# runtime config that sources this file and turns it on, but only when the
# TPM verdict for this boot is ok (mango/scripts/lock-status.sh). That
# config also adds the fingerprint prompt row, in $muted and $font.

$font = JetBrainsMono Nerd Font
$muted = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)

general {
    hide_cursor = false
    # An empty submit (Enter to wake the panels) does not reach PAM, so it
    # does not count as a failed attempt.
    ignore_empty_input = true
}

background {
    monitor =
    path = {{image}}
    blur_size = 8
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8917
    brightness = 0.8172
    vibrancy = 0.1686
    vibrancy_darkness = 0.05
}

# Clock: the boot screen's HH:MM, 76 px Light, on_surface. $TIME updates
# itself.
label {
    monitor =
    text = $TIME
    color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 69
    halign = center
    valign = center
}

# Date line = TOTP code, as on the boot screen: shield icon and "123 456",
# "TPM mismatch" in error colour, or the date when the TOTP cannot be read
# (no system/lockscreen sudo rule). One TPM call per 30 s slot; the other
# calls read lock-status.sh's cache.
label {
    monitor =
    text = cmd[update:1000] ~/.config/mango/scripts/lock-status.sh line {{colors.error.default.hex_stripped}}
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
}

# The greeter's card (Main.qml: implicitWidth 380, radius 20,
# surface_container fill, 1px outline_variant border). Drawn as a `shape`
# behind the `input-field`: hyprlock's `input-field` widget has its own
# outline/fill pair, but it is sized to the field alone, so it cannot also
# carry the card's extra margin around the field.
shape {
    monitor =
    size = 380, 86
    rounding = 20
    border_size = 1
    border_color = rgba({{colors.outline_variant.default.hex_stripped}}ff)
    color = rgba({{colors.surface_container.default.hex_stripped}}ff)
    position = 0, -77
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    position = 0, -77
    halign = center
    valign = center
    rounding = 10
    outline_thickness = 1
    inner_color = rgba({{colors.surface_container_high.default.hex_stripped}}ff)
    outer_color = rgba({{colors.outline_variant.default.hex_stripped}}ff)
    check_color = rgba({{colors.primary.default.hex_stripped}}ff)
    fail_color = rgba({{colors.error.default.hex_stripped}}ff)
    # Caps Lock turns the outline to the @warn colour; the notice row below
    # says it in words.
    capslock_color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    font_color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    font_family = $font
    placeholder_text = Password
    # $ATTEMPTS counts the failures since the lock started.
    fail_text = <i>$FAIL</i> ($ATTEMPTS)
    fade_on_empty = false
}

# Notice rows. Row 1 (y = -143) is the fingerprint prompt, added by the
# runtime config only when fingerprint login is on.

# Row 2: Caps Lock, from the keyboard LED. Polled every 500 ms, and only
# while the screen is locked.
label {
    monitor =
    text = cmd[update:500] ~/.config/mango/scripts/lock-status.sh caps
    color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    font_size = 12
    font_family = $font
    position = 0, -167
    halign = center
    valign = center
}

# Row 3: keep-awake (SPEC.md §7), the same @warn = tertiary colour mapping
# the bar's keepawake pill uses (matugen/templates/ironbar/style.css).
# `cmd[]` with no `update:` modifier runs the shell command once, when
# hyprlock starts, and never again — hyprlock's own source documents
# `updateEveryMs == 0` as "don't (static)" (src/renderer/widgets/IWidget.cpp,
# src/renderer/widgets/Label.cpp). That matches this spec's own CPU rule
# (read state once on open, never poll) better than a periodic
# `cmd[update:…]` would, at the cost of not clearing the message if
# keep-awake is turned off during the same lock — a cosmetic gap, not a
# safety one.
label {
    monitor =
    text = cmd[] systemctl --user is-active --quiet mango-keepawake.service && echo 'Keep-awake is on. This computer will not sleep.'
    color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    font_size = 12
    font_family = $font
    position = 0, -191
    halign = center
    valign = center
}
