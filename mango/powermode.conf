# Every knob for mango/scripts/powermode.sh's three power modes (full /
# battery / eco), in one place. Read (sourced) by powermode.sh and
# mango/scripts/battery-guard.sh — NOT by mango-bard (it watches the mode
# *state* file, not this config) or mango itself, despite living next to
# config.conf. Edit through the
# ~/.config/mango/ symlink like every other tracked file; no reinstall
# needed, only mango-powermode itself (the root helper under
# system/powermode/) needs a reinstall if changed.
#
# Every value here is re-validated by the root helper against a closed set
# before it touches sysfs — a bad or hostile value here is refused, not
# applied. See system/powermode/mango-powermode's valid() for the exact list.

# --- CPU ---------------------------------------------------------------
# Intel's energy/performance hint, per cpufreq policy. Legal values (from
# /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
# on this machine): default performance balance_performance balance_power power
PM_FULL_EPP=performance
PM_ECO_EPP=power

# ACPI firmware profile. Legal on this machine (see
# /sys/firmware/acpi/platform_profile_choices): quiet balanced performance
PM_FULL_PROFILE=performance
PM_ECO_PROFILE=quiet

# Turbo boost: 0 = allowed, 1 = disabled. Disabling it in eco is the single
# biggest saving in this file and the single most noticeable slowdown —
# compiles and page loads visibly drag.
PM_FULL_NO_TURBO=0
PM_ECO_NO_TURBO=1

# battery (unplugged, work continues) keeps the CPU responsive: EPP stays
# closer to full, turbo stays on, and the ACPI profile only steps down one
# notch. Only eco (battery low, weak charger, or a click) goes all the way.
PM_BAT_EPP=balance_power
PM_BAT_PROFILE=balanced
PM_BAT_NO_TURBO=0

# CPU governor is deliberately NOT here: it stays "powersave" in every mode.
# That is how intel_pstate active-mode HWP is meant to be driven (the EPP
# values above are what actually change behaviour); "performance" just pins
# max frequency and buys nothing over EPP=performance.

# --- Devices -------------------------------------------------------------
# PCIe/NVMe runtime power management (every device's power/control).
#   on       = never let the device suspend (lowest latency, no saving)
#   auto     = suspend when idle (lets the NVMe reach its low-power APST states)
#   baseline = whatever the kernel/driver already had it set to at boot,
#              captured once into /run/mango-powermode.baseline the first
#              time this ever runs
# battery reuses PM_ECO_PCI_PM (and every other knob below through WiFi) —
# these cost nothing in responsiveness, so there is no separate PM_BAT_ key.
PM_FULL_PCI_PM=baseline
PM_ECO_PCI_PM=auto

# SATA link power management is not a config key: this machine has no SATA
# host (NVMe only), so it would be a no-op either way. The root helper still
# nudges any scsi_host it finds (med_power_with_dipm in eco, max_performance
# in full) in case this file is ever copied to a machine that has one.

# snd_hda_intel's power_save, in idle-seconds before the codec suspends.
# 0 disables it. "baseline" restores whatever was set at boot (captured once,
# same as PCI_PM above).
PM_FULL_SND_HDA_POWERSAVE=baseline
PM_ECO_SND_HDA_POWERSAVE=1

# --- Writeback -------------------------------------------------------------
# vm.laptop_mode: batches disk writes so the SSD spends longer idle between
# them. vm.dirty_writeback_centisecs: how often the kernel flushes dirty
# pages, in centiseconds (1500 = 15s). Longer intervals in eco trade a larger
# window of data-loss-on-crash for fewer wakeups; full keeps the kernel's own
# defaults.
PM_FULL_VM_LAPTOP_MODE=0
PM_ECO_VM_LAPTOP_MODE=5
PM_FULL_VM_DIRTY_WB=500
PM_ECO_VM_DIRTY_WB=1500

# --- WiFi ------------------------------------------------------------------
# 802.11 power save (iw's power_save). "off" costs a little idle draw for
# lower latency; "on" is the saving.
PM_FULL_WIFI_POWERSAVE=off
PM_ECO_WIFI_POWERSAVE=on

# --- Screen ------------------------------------------------------------
# Backlight percentage set on ENTERING battery or eco. Whatever brightness
# you had before the first dim is remembered and restored on the way back to
# full (full <- battery <- eco loses nothing: the capture is first-touch-wins,
# not overwritten on the way further down). Adjusting the backlight by hand
# while already dimmed is never fought — this only fires once, on entry.
# Set either to empty to never touch the backlight for that mode.
PM_BAT_BRIGHT=70
PM_ECO_BRIGHT=40

# --- Battery threshold -------------------------------------------------
# Charge percent under which battery mode escalates itself to eco (checked by
# battery-guard.sh's existing 30s poll) — pausing/stopping containers and
# unloading ollama only happens below this line. Matches PM_ECO_DRAIN_FORCE_PCT
# below: both exist to stop waiting once the battery is genuinely low.
PM_BAT_ECO_PCT=40

# --- Docker ------------------------------------------------------------
# Container name prefix acted on entering eco (docker ps --format
# '{{.Names}}' matched against this as a plain prefix). Empty = never touch
# docker. Three outcomes, not one:
#   a docker exec/build is attached to a container  -> left running
#   a PM_ECO_BUSY_PROCS process is running, docker idle -> paused
#   neither                                          -> stopped
# Stopped containers are never restarted on the way back to full, by
# design — start bench on demand with `frappe-dev <env> up`. Paused ones are
# unpaused automatically, since they didn't ask to be stopped.
PM_ECO_DOCKER_PREFIX=frappe-

# Space-separated process names that count as "work is in flight" for the
# docker decision above — a match pauses containers instead of stopping them.
# Matched against `comm` (ps -eo comm=), so use the short name (`claude`, not
# the full path). Empty = never pause for this reason, only for a live docker
# exec/build. claude's own daemon/bg-pty-host/bg-spare helper processes are
# filtered out — only an actual session counts.
PM_ECO_BUSY_PROCS=claude

# --- Eco drain ---------------------------------------------------------
# On eco entry: hermes is paused right away. docker/paseo/ollama wait for
# any open omp/pi coding-agent session to go idle first, so a live session
# is never cut off mid-work. Matching is on the full command line, not the
# process name — omp runs under bun, pi under node, hermes under its venv's
# python, so `comm` alone (bun/node-MainThread/python3) can't tell one
# agent from another dev tool using the same interpreter.
#
# Empty = never touch that program.
PM_ECO_HERMES_MATCH=hermes-agent/hermes
PM_ECO_AGENT_MATCH=pi-coding-agent

# How often the drain loop samples CPU use (seconds), and how much combined
# CPU time across all matching processes counts as still working, not idle.
PM_ECO_DRAIN_POLL=30
PM_ECO_DRAIN_IDLE_CPU=1

# Below this battery percent, stop waiting for omp/pi and drain anyway —
# battery drain outranks letting a session finish on its own.
PM_ECO_DRAIN_FORCE_PCT=40

# paseo chat room the drain posts "on battery, containers paused" to. Empty
# = never post. Room is created on first use if it doesn't exist yet.
PM_ECO_PASEO_ROOM=power

# Re-warm the ollama models unloaded on eco entry once back on AC. Off by
# default: reloading a multi-GB model on every cable plug is worse than one
# slow first prompt after eco.
PM_ECO_OLLAMA_RESTORE=0

# --- Weak charger ----------------------------------------------------------
# A USB-C source negotiating less than this many watts (voltage_max *
# current_max on the ucsi-source-psy-* power supply) is treated as weak, same
# as the laptop staying on battery despite AC being plugged in. Either
# condition, sustained for PM_WEAK_POLLS consecutive battery-guard.sh polls
# (30s apart), forces eco with a warning until the charger recovers.
PM_WEAK_MIN_W=45
PM_WEAK_POLLS=2

# Seconds to ignore the weak-charger check after every resume from suspend.
# The USB-C PD controller can take minutes to renegotiate after s2idle —
# ucsi-source-psy-* and BAT0/status both report nonsense during that window,
# which reads as a weak or absent charger even though nothing is wrong.
# 420s (7 min) covers the 6 min window observed on this machine plus margin.
# The low-battery ladder is not gated by this — a flat battery on resume
# still has to act immediately.
PM_WEAK_SETTLE=420

# --- Charge ceiling ----------------------------------------------------
# Stop charging at this percent (charge_control_end_threshold) instead of
# 100, to slow calendar wear on a battery that lives on the cable most of
# the day. Re-validated by the root helper against a closed set (60/80/100)
# before it touches sysfs, same as every other key in this file. Overridden
# temporarily (e.g. before travel) with `powermode.sh charge <n>`, which
# resets to this value on the next reboot.
PM_CHARGE_LIMIT=80
