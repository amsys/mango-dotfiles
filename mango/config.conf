# More option see https://github.com/DreamMaoMao/mango/wiki/

# Qt/KDE apps otherwise fall back to the default light platform theme —
# kdeglobals is matugen-generated (see matugen/templates/kde/kdeglobals)
# and only gets read once this points Qt at the KDE platform plugin.
env=QT_QPA_PLATFORMTHEME,kde

# KDE/KIO builds its app list (ksycoca) from XDG_DATA_DIRS + the XDG menu file.
# mango exports neither, so kbuildsycoca6 produced an empty database and
# Dolphin's "Open With" list went blank. Only plasma-applications.menu exists
# in /etc/xdg/menus, hence the plasma- prefix.
#
# XDG_DATA_DIRS is NOT set here: the user flatpak exports dir is under $HOME,
# and mango's env= parser does a literal setenv with no expansion — "$HOME/..."
# would be exported verbatim. Set it in local.conf with an absolute path
# instead; local.conf.example ships the line ready to uncomment.
env=XDG_MENU_PREFIX,plasma-

# Autostart
# import-environment makes sure D-Bus-activated services (and anything else
# using the systemd user manager) see the env= vars above and QT_QPA_PLATFORMTHEME —
# dbus-update-activation-environment alone wasn't reaching them.
exec-once = systemctl --user import-environment XDG_DATA_DIRS XDG_MENU_PREFIX XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME && dbus-update-activation-environment --all

# Immediate — nothing here needs secrets. Wallpaper + bar come up first.
exec-once = ~/.config/mango/scripts/switchwall.sh --noswitch
# Not bare `waybar`: bars.sh generates one bar per monitor so each screen's tag
# pills show that screen's tags, then follows hotplug. Falls back to plain
# waybar if the IPC is unavailable.
exec-once = ~/.config/waybar/scripts/bars.sh
#exec-once = qs -d -c launcher  # replaced by rofi, see bind=Alt,space below
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# The tray applet exits immediately if no StatusNotifierHost is listening, and
# waybar's tray takes a moment to claim the name — a bare `arch-update --tray`
# here silently never survived. Upstream's own .desktop papers over it with
# `sleep 3`; wait for the actual bus name instead. (The arch-update.timer that
# does the checking is a separate, already-enabled systemd user unit.)
exec-once = until busctl --user status org.kde.StatusNotifierWatcher > /dev/null 2>&1; do sleep 0.5; done; arch-update --tray

# Tiered power button: tap opens the power menu, a 1-3.5s hold suspends on
# release. See the script header for why this cannot be a bind or a logind
# setting, and for the logind override it needs to not be fought.
exec-once = ~/.config/mango/scripts/powerkey.py

# Low-battery failsafe: warn at 20%, alarm at 10%, suspend at 5%. Without it
# the only thing below waybar's red glyph is UPower's PercentageAction=2.0,
# which on this machine resolves to an unclean power off because hibernate is
# not configured. Acting at 5% means that is never reached while awake.
exec-once = ~/.config/mango/scripts/battery-guard.sh

# Charger plug/unplug chime. Event driven off udev rather than folded into the
# guard's existing 30s poll: the point of a plug confirmation is catching a dead
# brick or a half-seated jack, which an answer fifteen seconds later does not do.
exec-once = ~/.config/mango/scripts/ac-watch.sh

# Secrets provider, then the one consumer that needs it.
exec-once = ~/.config/mango/scripts/keepassxc-autounlock.sh
exec-once = ~/.config/mango/scripts/wait-for-keepass-unlock.sh

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.95

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.25,1,0.5,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0,0,0.2,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=35
repeat_delay=250
numlockon=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=4
gappiv=4
gappoh=8
gappov=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
scratchpad_cross_monitor=1
borderpx=3
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# Wallpaper-derived colors (matugen), overrides the defaults above
source=./colors.conf

# Monitors
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.0,vrr:1

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun -display-drun "Launch"
bind=Alt,v,spawn,~/.config/rofi/clipboard.sh --launch
bind=Alt,slash,spawn,rofi -show recursivebrowser
bind=Alt,equal,spawn,rofi -show calc
bind=Alt,i,spawn,~/.config/rofi/ai.sh --launch
bind=Alt,grave,spawn,~/.config/rofi/window.sh --launch
bind=Alt,Return,spawn,kitty
bind=Alt,k,toggle_named_scratchpad,org.keepassxc.KeePassXC,none,keepassxc
bind=Alt,w,spawn_shell,gtk-launch "$(xdg-settings get default-web-browser)"
bind=Alt,e,spawn,dolphin
bind=SUPER,w,spawn,~/.config/mango/scripts/switchwall.sh
bind=SUPER,slash,spawn_shell,~/.config/mango/scripts/keybinds-cheatsheet.py --open

# lock screen
bind=SUPER,l,spawn_shell,pgrep -x swaylock || swaylock

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,grave,focuslast,
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,space,toggleoverview,
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT+SHIFT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
# Ctrl is deliberately left alone here: a compositor bind never reaches the
# focused app, so Ctrl+Left/Right and Ctrl+1..9 would kill word-jump and tab
# switching everywhere. Tag navigation lives on SUPER instead.
# _have_client skips empty tags, matching the SUPER scroll axisbind below.
bind=SUPER,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright_have_client,0
# send the focused window to the adjacent tag ("<" / ">")
bind=SUPER+SHIFT,comma,tagtoleft,0
bind=SUPER+SHIFT,period,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin (nudge a floating window; Ctrl+Shift is left to apps for select-by-word)
bind=SUPER+CTRL,Up,movewin,+0,-50
bind=SUPER+CTRL,Down,movewin,+0,+50
bind=SUPER+CTRL,Left,movewin,-50,+0
bind=SUPER+CTRL,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# media keys
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl s 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous

# screenshots
bind=none,Print,spawn_shell,grim - | wl-copy
bind=CTRL,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png
bind=ALT+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -

# screen recording — same key starts and stops, see scripts/screenrecord.sh
bind=ALT,Print,spawn,~/.config/mango/scripts/screenrecord.sh
bind=ALT+SHIFT,Print,spawn,~/.config/mango/scripts/screenrecord.sh --screen

# color picker and OCR
bind=ALT+SHIFT,c,spawn,hyprpicker -a
bind=ALT+SHIFT,o,spawn_shell,grim -g "$(slurp)" /tmp/ocr.png && tesseract /tmp/ocr.png stdout -l eng | wl-copy && rm -f /tmp/ocr.png

# session
bind=CTRL+ALT,Delete,spawn,~/.config/mango/scripts/powermenu.sh
bind=SUPER+SHIFT,l,spawn,systemctl suspend

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# window rule
windowrule=isfloating:1,appid:nm-connection-editor
# Nextcloud tray window, pinned to the top-right corner. Four non-obvious bits:
#   - the title anchor is load-bearing. Settings is a separate toplevel sharing
#     this appid, so an appid-only rule catches it too — and it has a 950px
#     minimum width that mango applies *after* positioning (client_set_size_bound
#     runs once the offsets are already resolved), leaving it pinned at x=1312
#     and 348px off the right edge. Hence the second rule below, which sets a
#     width above that minimum and omits offsetx/offsety so mango's fallback
#     path centres it instead.
#   - width/height are mandatory, not cosmetic. The client maps this surface at
#     7x7 and never grows it, so without a size rule the window is invisible.
#     Values >1 are pixels, values <=1 are a fraction of the monitor — hence
#     600px wide, three quarters of the screen tall.
#   - offsetx/offsety are percentages of half the free space measured from
#     centre, not pixels. 100/-100 means "flush to the top-right of the usable
#     area", which lands it gappoh/gappov (8px) in from the edges.
#   - NOT isnamedscratchpad. That looks like the right fit and isn't: mango
#     minimises a scratchpad window on map before showing it, and the client
#     reads that as "closed" and destroys the surface. Plain floating is also
#     enough — the client builds a fresh toplevel on every open, so the window
#     always lands on the active tag anyway.
# Staying open on focus loss is the client's job, not mango's — it needs
# showMainDialogAsNormalWindow=true in ~/.config/Nextcloud/nextcloud.cfg
# (see README's not-covered checklist). Without that it is a Qt popup and
# self-closes the moment sloppyfocus hands focus elsewhere.
windowrule=isfloating:1,width:600,height:0.75,offsetx:100,offsety:-100,appid:com.nextcloud.desktopclient.nextcloud,title:^Nextcloud$
windowrule=isfloating:1,width:960,height:0.75,appid:com.nextcloud.desktopclient.nextcloud,title:^Nextcloud Settings$
windowrule=isnamedscratchpad:1,width:0.8,height:0.9,appid:org.keepassxc.KeePassXC
# ssh-askpass must float above everything, on every tag — it can be summoned
# from any workspace and blocks the ssh command until answered.
windowrule=isfloating:1,isglobal:1,isoverlay:1,appid:org.kde.ksshaskpass
# Video must never dim at unfocused_opacity. mango can't detect playback, so
# match the windows that only ever show video: dedicated players, and browser
# picture-in-picture. Matchers are unanchored PCRE2 — ^...$ keeps mpv off
# mpvpaper. Omitting focused_opacity on the PiP rule inherits the global 1.0.
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^(mpv|vlc|celluloid|io.github.celluloid_player.Celluloid)$
windowrule=unfocused_opacity:1.0,appid:^(firefox|librewolf)$,title:^Picture-in-Picture$

# Per-machine overrides (monitors, env). Sourced last so any directive here
# (e.g. a monitorrule for the same output) wins over the defaults above.
# Created by install.sh from mango/local.conf.example, not tracked in git.
source=./local.conf
