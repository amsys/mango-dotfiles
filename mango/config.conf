# Nextcloud tray window, pinned to the top-right corner. Re-verified on
# 34.0.1daily (was written against 33.0.7daily) — width/height forcing is
# still required, not just cosmetic: tried dropping it since the surface no
# longer maps at 7x7, but a floating window with no size rule gets a smaller
# natural size than before and the offset math (calibrated for this box) then
# lands it mostly on the neighbour monitor with only a sliver on the first.
# Four non-obvious bits, all still true on 34.x:
#   - the title anchor is load-bearing: Settings is a separate toplevel that
#     shares this appid, and an appid-only rule would pin it top-right too.
#     Anchoring to ^Nextcloud$ excludes it; give Settings its own rule if it
#     turns out to need one on 34.x — untested, so not assumed here.
#   - width/height are mandatory. Values >1 are pixels, values <=1 are a
#     fraction of the monitor — this rule used height:0.75 until
#     2026-08-26, when it was changed to a literal 810px (three quarters of
#     this box's 1080px eDP-1/DP-1). Reason: applyrules (mango.c:1827-1834)
#     dereferences the monitor unconditionally to resolve a fraction, with
#     no NULL guard — if every output is disabled (selmon == NULL, see
#     rescue-outputs.sh's header) mapping a matching window crashes mango
#     and kills every other application with it. Literal pixels take the
#     branch that never dereferences the monitor. Not a behaviour change on
#     this machine (both outputs are 1920x1080); revisit the literal values
#     if the monitor size ever changes, or drop them if upstream adds the
#     guard.
#   - offsetx/offsety are percentages of half the free space measured from
#     centre, not pixels. 100/-100 means "flush to the top-right of the usable
#     area", which lands it gappoh/gappov (8px) in from the edges.
#   - NOT isnamedscratchpad, same reason as before: mango minimises a
#     scratchpad window on map before showing it, and the client reads that as
#     "closed" and destroys the surface.
# showMainDialogAsNormalWindow is left at its 34.x default (false) — the
# client only honours it when Qt's own isSystemTrayAvailable() reports true,
# which is known-flaky on wlroots compositors (upstream nextcloud/desktop
# issues #8999, #4602, #9377). If the tray is detected as unavailable the
# client forces normal-window mode regardless of this key, so whether the
# window auto-closes on focus loss is not reliably controllable from here —
# confirmed live: it does not close on focus loss, Escape closes it instead.
windowrule=isfloating:1,width:600,height:810,offsetx:100,offsety:-100,appid:com.nextcloud.desktopclient.nextcloud,title:^Nextcloud$
# KeePassXC's own MinimizeToTray AND ShowTrayIcon must stay false
# (~/.config/keepassxc/keepassxc.ini [GUI]). The trap is
# MainWindow::hideWindow() (KeePassXC 2.7.12): when a tray icon is enabled it
# calls hide(), which destroys the Wayland surface. The close button
# (MinimizeOnClose=true), startup (MinimizeOnStartup), MinimizeAfterUnlock,
# and MinimizeToTray all route through hideWindow(). With ShowTrayIcon=false,
# hideWindow() falls back to showMinimized(), which keeps the surface mapped
# — every hide path becomes safe at once. With no surface to toggle, Alt+k
# finds no window, spawns a duplicate `keepassxc` process instead, and that
# duplicate's single-instance IPC signals the first one to raise itself via
# QWindow::requestActivate() — unsupported on Wayland, so the raise is
# unreliable. Confirmed live: 190+ duplicate launches in one boot, and again
# on 2026-08-29 (~15 duplicates in 3 minutes after the close button unmapped
# the window).
# ignore_minimize:0 lets mango accept the client's minimize request.
# keepassxc.ini sets HideWindowOnCopy=true and MinimizeAfterUnlock=true, so
# a copy or an unlock sends that request, and the close button sends it too
# (MinimizeOnClose=true). mango's set_minimized() moves the client into the
# same hidden-scratchpad state that Alt+k toggles, and the surface stays
# mapped — Alt+k finds it, no duplicate spawn. This is safe only because
# MinimizeToTray stays false.
# NOT isnamedscratchpad, NOT a title matcher, and NOT the 1536x972 size —
# on purpose. mango applies windowrule only once, at map (applyrules() is
# called from commitnotify()/mapnotify(), never from the set_title
# listener), so a rule keyed on a title only matches if the window already
# carries that title when it maps. At map time the vault is locked and the
# title is "<database> [Locked] - KeePassXC" (or the separate "Unlock
# Database - KeePassXC" window) — never "<database> - KeePassXC" — so a
# title-anchored rule never applies here; it did not apply on this machine
# and both symptoms below trace back to it:
#   - init_client_properties() defaults ignore_minimize to 1 for every
#     client, and the rule never ran to clear it, so every minimize request
#     (a copy, an unlock, the close button) was silently dropped.
#   - isnamedscratchpad also never applied, so the window kept the plain
#     scratchpad geometry from scratchpad_width_ratio/scratchpad_height_ratio
#     (config.conf above) — that geometry, not this rule, is what sizes it.
# Alt+k still works without any of this: toggle_named_scratchpad() sets
# isnamedscratchpad on the matched client itself, appid-only, no rule
# needed. Keeping this rule to appid+ignore_minimize only means it also
# reaches the "Generate Password"/"Unlock Database" dialogs, which is
# harmless — they float at their natural size via the parent-implies-
# floating default in applyrules, since neither width nor height is set
# here.
# qt5-wayland must stay installed and explicit. KeePassXC 2.7.12 is Qt5. With
# no Qt5 Wayland plugin it falls back to xcb and runs on XWayland, where the
# appid becomes "KeePassXC" and this rule stops matching — Alt+k and Alt+q then
# do nothing. An orphan sweep removed the package on 2026-09-01.
windowrule=ignore_minimize:0,appid:org.keepassxc.KeePassXC
# ssh-askpass must float above everything, on every tag — it can be summoned
# from any workspace and blocks the ssh command until answered.
windowrule=isfloating:1,isglobal:1,isoverlay:1,appid:org.kde.ksshaskpass
# Video must never dim at unfocused_opacity. mango can't detect playback, so
# match the windows that only ever show video: dedicated players, and browser
# picture-in-picture. Matchers are unanchored PCRE2 — ^...$ keeps mpv off
# mpvpaper. Omitting focused_opacity on the PiP rule inherits the global 1.0.
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^(mpv|vlc|celluloid|io.github.celluloid_player.Celluloid)$
windowrule=unfocused_opacity:1.0,appid:^(firefox|librewolf)$,title:^Picture-in-Picture$

# Per-machine overrides (monitors, env). Sourced last so any directive here
# (e.g. a monitorrule for the same output) wins over the defaults above.
# Created by install.sh from mango/local.conf.example, not tracked in git.
source=./local.conf
