# More option see https://github.com/DreamMaoMao/mango/wiki/

# Qt/KDE apps otherwise fall back to the default light platform theme —
# kdeglobals is matugen-generated (see matugen/templates/kde/kdeglobals)
# and only gets read once this points Qt at the KDE platform plugin.
env=QT_QPA_PLATFORMTHEME,kde

# KDE/KIO builds its app list (ksycoca) from XDG_DATA_DIRS + the XDG menu file.
# mango exports neither, so kbuildsycoca6 produced an empty database and
# Dolphin's "Open With" list went blank. Only plasma-applications.menu exists
# in /etc/xdg/menus, hence the plasma- prefix.
#
# XDG_DATA_DIRS is NOT set here: the user flatpak exports dir is under $HOME,
# and mango's env= parser does a literal setenv with no expansion — "$HOME/..."
# would be exported verbatim. Set it in local.conf with an absolute path
# instead; local.conf.example ships the line ready to uncomment.
env=XDG_MENU_PREFIX,plasma-

# Autostart
# import-environment makes sure D-Bus-activated services (and anything else
# using the systemd user manager) see the env= vars above and QT_QPA_PLATFORMTHEME —
# dbus-update-activation-environment alone wasn't reaching them. mango never
# starts graphical-session.target itself, so nothing WantedBy= it (mango-bard,
# mango-sleep-lock, mango-powerkey) ever ran at login. Starting the target
# directly is not an option — systemd ships it with RefuseManualStart=yes,
# so `systemctl --user start graphical-session.target` always errors
# (verified: exit code 4, "may be requested by dependency only"). Start the
# leaf units themselves instead; that bypasses the target and needs no
# dependency on it.
# `restart`, not `start`, since loginctl Linger keeps the user manager (and
# any already-running instance) alive across logout, and `start` would then
# be a no-op that leaves last session's mango-bard running against a dead
# WAYLAND_DISPLAY/mmsg socket.
exec-once = systemctl --user import-environment XDG_DATA_DIRS XDG_MENU_PREFIX XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME && dbus-update-activation-environment --all && systemctl --user restart mango-bard.service mango-sleep-lock.service mango-powerkey.service mango-outputs.service

# One StatusNotifierWatcher, owned early. kded6 and the bar both ship one, and
# whichever claims org.kde.StatusNotifierWatcher first wins. kded6 is normally
# D-Bus-activated on demand by the first Qt app (QT_QPA_PLATFORMTHEME=kde makes
# that certain), which can land hours into the session — it then takes the name
# with an empty registry and every already-registered item disappears. Clients
# that re-register on NameOwnerChanged survive; the Nextcloud client does not.
# Starting kded6 up front makes it the owner for the whole session. ironbar
# sees the name taken and runs its `tray` module as a host only, so its
# restarts no longer disturb the registry.
exec-once = systemctl --user start plasma-kded6.service

# Immediate — nothing here needs secrets. Wallpaper + bar come up first.
# swaybg straight from theme.json: it paints ~0.4 s before switchwall would
# reach it (no identify/mmsg/jq first). switchwall then sees the identical
# swaybg and leaves it alone, so the desktop never drops back to rootcolor.
exec-once = swaybg -i "$(jq -r .background.wallpaperPath ~/.config/mango/theme.json)" -m fill
exec-once = ~/.config/mango/scripts/switchwall.sh --noswitch
# ironbar + mango-bard (see IRONBAR.md) — replaces waybar/bars.sh at the T8
# cutover. start.sh generates ~/.config/ironbar/config.json from the live
# `mmsg get all-monitors` list (mango-bard gen-config), then execs ironbar.
exec-once = ~/.config/ironbar/scripts/start.sh

#exec-once = qs -d -c launcher  # replaced by rofi, see bind=Alt,space below
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ZapZap, hidden to tray — the busctl wait below is needed because a tray
# applet started before ironbar claims the StatusNotifierWatcher bus name
# silently never survives; upstream's own .desktop papers over it with a
# `sleep 3` instead. `--hideStart` is the flag ZapZap's own XDG autostart
# entry already uses; that entry never fires because mango runs no XDG
# autostart handler, so this exec-once replaces it. ZapZap's own config
# (~/.config/ZapZap/ZapZap.conf) already has `start_background=true` and
# `tray_icon=true`.
exec-once = until busctl --user status org.kde.StatusNotifierWatcher > /dev/null 2>&1; do sleep 0.5; done; zapzap --hideStart

# Tiered power button (tap = menu, 1-3.5s hold = suspend on release) runs as
# mango-powerkey.service now, not exec-once — see the service's own comment
# for why: exec-once had no supervisor, so a short read/EOF or a device
# re-enumeration left the power button dead until the next login. Started
# below alongside mango-bard/mango-sleep-lock, same reasoning.

# Low-battery failsafe: warn at 20%, alarm at 10%, suspend at 5%. Without it
# the only thing below the bar's own `.battery.critical` red glyph is UPower's PercentageAction=2.0,
# which on this machine resolves to an unclean power off because hibernate is
# not configured. Acting at 5% means that is never reached while awake.
exec-once = ~/.config/mango/scripts/battery-guard.sh

# Charger plug/unplug chime. Event driven off udev rather than folded into the
# guard's existing 30s poll: the point of a plug confirmation is catching a dead
# brick or a half-seated jack, which an answer fifteen seconds later does not do.
exec-once = ~/.config/mango/scripts/ac-watch.sh

# Secrets provider, then the one consumer that needs it.
exec-once = ~/.config/mango/scripts/keepassxc-autounlock.sh
exec-once = ~/.config/mango/scripts/wait-for-keepass-unlock.sh

