# Manual escape for the frozen-desktop state (2026-08-26: every output's
# geometry zeroed, screen stops drawing, input still works — see
# rescue-outputs.sh's own header). mango-outputs.service already polls for
# this, but input keeps working during the freeze even when the watchdog
# doesn't, so this works when nothing else does.
bind=SUPER+SHIFT,o,spawn,~/.config/mango/scripts/rescue-outputs.sh

# Manual escape for a stuck rofi overlay (2026-09-02: a pomodoro phase
# boundary landing while the screen was locked left a full-screen rofi
# surface visible but deaf after unlock — see focus-break.sh's swaylock
# guard and OVERLAY_TIMEOUT for the actual fix; this key is the backstop
# for any case those miss). ALT,q (killclient) cannot touch a layer
# surface, so there was no existing key for this.
bind=SUPER+SHIFT,Escape,spawn,pkill -x rofi

# pulls the next/previous occupied tag from either physical monitor onto
# wayvnc's virtual output (ironbar/scripts/remote.sh --pull-next/--pull-prev;
# no-op with a notice if wayvnc.service isn't running), and sends the
# current pull back with Home. Not letter keys: this needs to be reachable
# from a device that only sends modifiers + Tab/Esc/PgUp/PgDown/Home. CTRL
# is normally left to applications (docs/keybinds.md), but SUPER+CTRL is
# already used above for window nudges, and no bare CTRL bind is added here.
bind=SUPER+CTRL,Next,spawn,~/.config/ironbar/scripts/remote.sh --pull-next
bind=SUPER+CTRL,Prior,spawn,~/.config/ironbar/scripts/remote.sh --pull-prev
bind=SUPER+CTRL,Home,spawn,~/.config/ironbar/scripts/remote.sh --restore

# lock screen
# sleep-lock.py's own `lock` subcommand pauses the pomodoro around the lock
# (so a phase boundary can't fire a rofi overlay behind the lock surface —
# see focus-break.sh's own guard for the second line of defense) and checks
# for an already-running swaylock itself before pausing anything: swaylock
# refuses a second instance (only one client can hold ext-session-lock-v1,
# so a double-press exits 2), and once locked the lock surface owns keyboard
# focus so this bind cannot fire again anyway. A pgrep guard here would also
# match zombie swaylocks and silently no-op the key — see mango-sleep-lock's
# child reap in sleep-lock.py.
bind=SUPER,l,spawn,~/.config/mango/scripts/sleep-lock.py lock

