[package]
name = "mango-bard"
version = "0.1.0"
edition = "2021"

# T1 scope: clock collector + powermode watcher + control socket + ironbar
# IPC client. Later stages add zbus (T3), a pactl child (T4), etc — see
# IRONBAR.md.

[dependencies]
# default-features off: no worker threads, so no wakeups beyond what T1's
# own fds generate. `time` is for tokio::time::timeout around the IPC round
# trip — see IRONBAR.md Spike findings S4 (an incomplete write wedges every
# other ironbar IPC client, so every round trip needs a hard deadline).
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "macros", "signal", "time"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
