# Placed at
# /etc/systemd/system/systemd-ask-password-console.service.d/10-mango-cryptbox.conf
# by the mango-cryptbox mkinitcpio hook — inside the initramfs only, never on
# the host. The host's own systemd-ask-password-console.service must stay
# unmodified, or every post-boot password prompt would try to draw the frame.
#
# ExecStartPre is the right seam: it runs in the agent's own unit, so it is
# already ordered after systemd-vconsole-setup.service (see the unit's own
# After=) with no extra dependency to add.
[Service]
ExecStartPre=/usr/local/bin/mango-cryptbox
