# Installed to /etc/systemd/system/sddm.service.d/10-mango.conf by
# system/plymouth/install.sh.
#
# Arch's sddm.service only orders after plymouth-quit.service, whose
# `plymouth quit` returns while plymouthd is still tearing down its DRM
# device. plymouth-quit-wait.service (`plymouth --wait`) finishes when the
# daemon is gone, which is the ordering Fedora's display managers use.
#
# No `--retain-splash` on plymouth-quit: SDDM has no plymouth handover, and
# with the splash retained X hung before it opened /dev/dri/card1 on every
# boot (i915, 2026-09-01). The prompt-to-greeter transition therefore has a
# short gap; the wallpaper and colours on both sides still match.
[Unit]
After=plymouth-quit-wait.service
