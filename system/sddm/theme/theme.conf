[General]

# Background is rewritten by /usr/local/bin/sddm-theme-sync on every wallpaper
# switch — the extension follows whatever matugen's current wallpaper actually
# is. Editing it by hand only lasts until the next switch.
Background="background.png"

# 0.0-1.0. Darkens the wallpaper behind the panel so text stays readable on a
# bright photo. The blur is not configurable; it is always on.
Dim="0.35"

# Must be a font under /usr/share/fonts — the greeter runs as the `sddm` user
# and cannot read ~/.local/share/fonts (/home/martin is mode 710). Also supplies
# the Nerd Font glyphs used for the power and dropdown icons.
Font="JetBrainsMono Nerd Font"

# Qt date/time format strings.
ClockFormat="HH:mm"
DateFormat="dddd, d MMMM"
