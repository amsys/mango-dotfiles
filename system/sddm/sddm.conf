# Installed to /etc/sddm.conf by system/sddm/install.sh. Vendor defaults live in
# /usr/lib/sddm/sddm.conf.d/default.conf and still apply for anything not set here.
#
# No GreeterEnvironment=QML2_IMPORT_PATH: mango-sddm is a flat theme directory,
# so QML resolves Colors.qml as a sibling of Main.qml with no import path and no
# qmldir. No InputMethod either — the on-screen keyboard is deliberately not part
# of this theme.

[Theme]
Current=mango-sddm
