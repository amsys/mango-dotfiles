# Installed to /etc/sddm.conf by system/sddm/install.sh. Vendor defaults live in
# /usr/lib/sddm/sddm.conf.d/default.conf and still apply for anything not set here.
#
# No QML2_IMPORT_PATH in GreeterEnvironment: mango-sddm is a flat theme directory,
# so QML resolves Colors.qml as a sibling of Main.qml with no import path and no
# qmldir. No InputMethod either — the on-screen keyboard is deliberately not part
# of this theme.

# DisplayServer=wayland: with the x11 default SDDM starts /usr/bin/X on VT 2
# the moment it comes up, before it knows a greeter is needed. Autologin
# never shows the greeter, so that X server idled for the whole session and
# the boot paid ~0.9 s plus a VT 2 -> VT 1 switch for it (journal,
# 2026-09-02). With wayland SDDM launches nothing on autologin and starts
# the session on the current VT. The greeter (logout, or after three mango
# crashes) then runs under CompositorCommand below.
[General]
DisplayServer=wayland
# layer-shell lets the greeter cover the output under kwin instead of being
# a plain window. This is the only GreeterEnvironment entry, see above.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

# weston is not installed; kwin_wayland is (plasma-workspace). Same flags
# Plasma ships in its own kde_settings.conf, minus the on-screen keyboard.
[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=mango-sddm

# Autologin fires on boot only (Relogin defaults to false): a logout still
# returns to the greeter, and a compositor crash restarts in place through
# session.sh, so neither path loops. The LUKS passphrase at the plymouth
# prompt stays the one secret each boot; the greeter password added nothing
# after it. Session must resolve in SDDM's SessionDir search —
# /usr/local/share/wayland-sessions/mango.desktop is installed above the
# package copy by install.sh.
[Autologin]
User=martin
Session=mango.desktop
