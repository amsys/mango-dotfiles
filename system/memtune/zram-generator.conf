# Compressed swap in RAM. This is the machine's primary swap device; the
# 4 GiB /swapfile sits at priority -1 as a last-resort backstop only.
#
# ram / 2 = 23.3 GiB on a 46.7 GiB machine. This is a cap, not a reservation:
# zram allocates pages only as they are used, so an empty zram costs nothing.
#
# Do not raise this to `ram`. zram's backing store IS RAM, so filling it does
# not free memory, it relocates it. At a realistic 2:1 on Rust build output a
# full 46.7 GiB zram would consume ~23 GiB of RAM and leave nothing for the
# working set it exists to protect.
#
# There is deliberately no writeback/backing_dev here. zram writeback needs a
# block device or partition (a swapfile cannot be used) and an explicit
# trigger on a timer — it is not automatic tiering — and the only candidate
# device is the DRAM-less QLC NVMe whose write stalls 99-dirty.conf works
# around. See VAULT.md.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
