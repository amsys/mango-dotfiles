# Cap the dirty pool in absolute terms, not as a % of RAM — the ratio defaults
# (20% / 10%) meant up to 9.3 GiB of dirty pages could pile up before the
# kernel even started throttling writers, on a DRAM-less QLC NVMe. That's the
# freeze signature: everything fine, then a multi-GB flush stalls the disk.
vm.dirty_background_bytes = 268435456    # 256 MiB — start writeback early
vm.dirty_bytes            = 1073741824   # 1 GiB  — hard throttle
vm.dirty_expire_centisecs = 1500         # flush pages older than 15s (was 30s)
