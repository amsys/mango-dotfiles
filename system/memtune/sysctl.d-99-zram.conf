# Swap goes to zram first (priority 100), so swapping out is a memcpy plus a
# zstd compress, not a disk write. Raise swappiness to prefer that over
# evicting page cache. The kernel default of 60 is tuned for a rotational
# swap partition, which this machine does not have.
vm.swappiness = 100

# zram is RAM: there is no seek to amortise, so reading 2^3 = 8 pages per
# fault only spends decompression CPU on pages nothing asked for. 0 means
# fault in one page at a time.
vm.page-cluster = 0
