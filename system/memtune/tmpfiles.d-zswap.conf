# Turn zswap off. It is not useful here and it actively defeats zram.
#
# Arch builds the kernel with CONFIG_ZSWAP_DEFAULT_ON=y, so zswap starts
# enabled and sits in front of EVERY swap device — including /dev/zram0.
# A page then gets compressed twice: zstd into the zswap pool, then zstd
# again by zram when the pool spills. Measured on nauthiz 2026-09-08, before
# this file existed:
#
#   /sys/block/zram0/mm_stat -> 528384 524352 ...
#
# 528384 bytes in, 524352 bytes stored: a 1.008:1 ratio. zram was achieving
# no compression at all, because it was being handed data zswap had already
# compressed. Meanwhile the zswap pool held 1209228 kB in 240540 kB (4.3:1),
# so zswap was doing all the work and zram was pure overhead.
#
# zswap is built in, not a module, so modprobe.d cannot set this. The other
# option is zswap.enabled=0 on the kernel command line, which was rejected:
# it means editing /etc/default/grub and regenerating grub.cfg on a Secure
# Boot machine, and the boot chain is not worth disturbing for a value a
# one-line sysfs write sets just as well.
#
# Note this stops zswap ACCEPTING new pages. Pages already in the pool stay
# there until something faults them in. A reboot is what fully clears it.
w /sys/module/zswap/parameters/enabled - - - - N
