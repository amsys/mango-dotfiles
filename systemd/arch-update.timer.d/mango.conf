# Override for the arch-update package's own arch-update.timer.
#
# Our bar pill (ironbar/bard/src/archupdate.rs) reads the state files this
# timer's service writes. The tray applet used to offer a manual "check
# now" fallback; mango's config.conf no longer starts it, so the timer must
# not miss a run. Upstream ships Persistent=no and OnUnitActiveSec=6h — a
# missed run (for example, a suspend across the 6h mark) then leaves the
# pill stale until the next boot. Persistent=true replays a missed run at
# the next boot; the shorter interval bounds staleness between runs.
[Timer]
Persistent=true
OnUnitActiveSec=1h
